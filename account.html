<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceDNS — My account</title><script src="/auth_frontend.js"></script>
<style>body{font:16px system-ui,sans-serif;margin:0;background:#eef5f9;color:#143245}main{max-width:1100px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #b9d8d4;border-radius:12px}form{display:flex;gap:1rem;flex-wrap:wrap;align-items:end;margin:1rem 0}label{display:grid;gap:.4rem}input,select,button{font:inherit;padding:.6rem;border:1px solid #8aaeb7;border-radius:5px}button{cursor:pointer;background:#0f766e;color:white}button:disabled{opacity:.5;cursor:not-allowed}nav{padding:1rem;display:flex;gap:1rem;flex-wrap:wrap;background:#143245;color:white}nav a{color:white}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.65rem;border-bottom:1px solid #cddce1;overflow-wrap:anywhere}.table-scroll{overflow:auto}[hidden]{display:none!important}#security-message{background:#ffe8dc;padding:1rem}a{color:#0f766e}small{display:block}input[type=checkbox]{width:auto}</style>
<script defer src="/security_ui.js"></script></head><body><main><h1>My account</h1><p id="page-status" role="status" aria-live="polite"></p>
<p id="password-required" hidden>You must change your temporary password before continuing.</p>
<form id="password-form"><label>Current password<input id="current-password" name="current_password" type="password" autocomplete="current-password" required maxlength="128"></label><label>New password (12–128 characters)<input id="new-password" name="new_password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><label>Confirm new password<input id="confirm-password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><button id="password-submit">Change password and sign out</button></form>
<section id="session-section"><h2>My sessions</h2><button id="revoke-all-sessions">Sign out all my sessions</button><ul id="sessions"></ul></section>
</main></body></html>

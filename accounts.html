<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceDNS — User administration</title><script src="/auth_frontend.js"></script>
<style>body{font:16px system-ui,sans-serif;margin:0;background:#eef5f9;color:#143245}main{max-width:1100px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #b9d8d4;border-radius:12px}form{display:flex;gap:1rem;flex-wrap:wrap;align-items:end;margin:1rem 0}label{display:grid;gap:.4rem}input,select,button{font:inherit;padding:.6rem;border:1px solid #8aaeb7;border-radius:5px}button{cursor:pointer;background:#0f766e;color:white}button:disabled{opacity:.5;cursor:not-allowed}nav{padding:1rem;display:flex;gap:1rem;flex-wrap:wrap;background:#143245;color:white}nav a{color:white}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.65rem;border-bottom:1px solid #cddce1;overflow-wrap:anywhere}.table-scroll{overflow:auto}[hidden]{display:none!important}#security-message{background:#ffe8dc;padding:1rem}a{color:#0f766e}small{display:block}input[type=checkbox]{width:auto}</style>
<script defer src="/security_ui.js"></script></head><body><main><h1>User administration</h1><p id="page-status" role="status" aria-live="polite"></p>
<p>New and reset passwords are temporary. Changing roles or status revokes existing sessions. The last active administrator is protected by the server.</p>
<form id="create-user-form"><label>Username<input name="username" id="create-username" autocomplete="off" required maxlength="128"></label><label>Temporary password<input name="password" id="create-password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><label>Role<select name="role" id="create-role"><option value="viewer">viewer</option><option value="operator">operator</option><option value="admin">admin</option></select></label><button id="create-user">Create user</button></form>
<div class="table-scroll"><table><thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table></div>
<dialog id="reset-dialog"><h2>Set temporary password</h2><form id="reset-password-form"><label>Temporary password<input id="reset-password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><button type="submit">Reset password</button><button type="button" id="reset-cancel">Cancel</button></form></dialog>
</main></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceDNS — Activity and audit</title><script src="/auth_frontend.js"></script>
<style>body{font:16px system-ui,sans-serif;margin:0;background:#eef5f9;color:#143245}main{max-width:1100px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #b9d8d4;border-radius:12px}form{display:flex;gap:1rem;flex-wrap:wrap;align-items:end;margin:1rem 0}label{display:grid;gap:.4rem}input,select,button{font:inherit;padding:.6rem;border:1px solid #8aaeb7;border-radius:5px}button{cursor:pointer;background:#0f766e;color:white}button:disabled{opacity:.5;cursor:not-allowed}nav{padding:1rem;display:flex;gap:1rem;flex-wrap:wrap;background:#143245;color:white}nav a{color:white}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.65rem;border-bottom:1px solid #cddce1;overflow-wrap:anywhere}.table-scroll{overflow:auto}[hidden]{display:none!important}#security-message{background:#ffe8dc;padding:1rem}a{color:#0f766e}small{display:block}input[type=checkbox]{width:auto}</style>
<script defer src="/security_ui.js"></script></head><body><main><h1>Activity and audit</h1><p id="page-status" role="status" aria-live="polite"></p>
<p>Times below use your browser’s local timezone. Filters accept local dates. Audit entries are read-only; only administrators can export.</p>
<form id="audit-filter-form"><label id="actor-filter">User ID<input name="user_id" id="audit-user-id"></label><label>Action<input name="action" id="audit-action"></label><label>Outcome<input name="outcome" id="audit-outcome"></label><label>Since<input name="since" id="audit-since" type="datetime-local"></label><label>Until<input name="until" id="audit-until" type="datetime-local"></label><label>Target<input name="target" id="audit-target"></label><button id="audit-apply">Apply filters</button></form>
<button id="audit-export" hidden>Export filtered JSONL</button><div class="table-scroll"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Outcome</th><th>Source IP</th><th>Request / job</th></tr></thead><tbody id="audit-events"></tbody></table></div>
<p id="audit-pagination"></p><button id="audit-prev" disabled>Previous</button> <button id="audit-next" disabled>Next</button>
</main></body></html>
